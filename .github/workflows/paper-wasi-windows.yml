name: Private WASI Windows probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-wasi:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Restrict probe to private repositories
        if: ${{ !github.event.repository.private }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install locked worker and run native isolation probes
        shell: pwsh
        run: |
          python -m pip install 'pytest==8.4.2' 'pydantic>=2,<3'
          if ($LASTEXITCODE -ne 0) { throw 'Installing pytest failed.' }
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r desktop/electron/requirements-paper-windows-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing the PAPER worker lock failed.' }
          $archive = Join-Path $env:RUNNER_TEMP 'python-wasi.tar.gz'
          $root = Join-Path $env:RUNNER_TEMP 'python-wasi'
          Invoke-WebRequest -Uri 'https://github.com/vmware-labs/webassembly-language-runtimes/releases/download/python/3.12.0%2B20231211-040d5a6/python-3.12.0-wasi-sdk-20.0.tar.gz' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6c1cddbb69ae09e87eee2906bdc70539bff5f2969818a6f8457d4e6a6eb67d4d') { throw 'WASI archive hash mismatch.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          tar -xzf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw 'WASI fixture extraction failed.' }
          $env:VIBE_WASI_TEST_ROOT = $root
          $env:PYTHONPATH = 'agent'
          python -c "import wasmtime; print('Windows Wasmtime import OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Wasmtime import failed.' }
          python -m pytest agent/tests/execution/test_wasi_worker_host.py -k 'real_wasi_worker or infinite_loop' -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows WASI isolation probes failed.' }
